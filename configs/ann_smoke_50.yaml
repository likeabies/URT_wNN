# ANN reproduction; counts below are per (rho, beta) combination.
seed: 42
output:
  root_dir: results

data:
  seq_len: 50
  rhos: [1, 0.99, 0.95, 0.9, 0.5, 0.2]
  betas: [0.99, 0.95, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0]
  train:
    n_unit_root: 10
    n_stationary: 2
    seed: 1042
  val:
    n_unit_root: 2
    n_stationary: 2
    seed: 2042
  test:
    n_unit_root: 2
    n_stationary: 2
    seed: 3042

model:
  hidden_size: 20
  dropout: 0

loss:
  w1: 1.0
  w2: 1.0

# Reproduction choices for training details not specified in the paper.
training:
  optimizer: Adam
  lr: 0.001
  batch_size: 256
  max_epochs: 3
  early_stopping_patience: 2
  weight_decay: 0.0
  shuffle: true
